<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ELM Spam vs Ham Classifier</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      padding: 2rem;
    }

    h1 {
      color: #333;
    }

    #userInput {
      width: 100%;
      font-size: 1.25rem;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #autoOutput {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }

    #langFill {
      background: #ccc;
      padding: 0.5rem;
      font-weight: bold;
      color: #fff;
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    #status {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #666;
    }

    #confusion {
      margin-top: 0.75rem;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      color: #333;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0.75rem;
      white-space: pre;
      overflow-x: auto;
    }
  </style>
</head>

<body>
  <h1>ELM: Spam vs Ham Classifier</h1>
  <p>Trained on the AbdulHadi806/mail_spam_ham_dataset SMS/email dataset.</p>
  <input type="text" id="userInput" placeholder="Loading model…" autocomplete="off" disabled />
  <div id="autoOutput"></div>
  <div id="langFill"></div>
  <div id="status"></div>
  <pre id="confusion"></pre>

  <script src="/astermind.umd.js"></script>
  <script src="/main.js"></script>
</body>

</html>
